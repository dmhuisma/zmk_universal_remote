
CONFIG_SPI=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000
# ZMK only counts input-device events, such as touches, as activity with
# pointing support enabled.
CONFIG_ZMK_POINTING=y
# Boot on the internal RC oscillator instead of waiting for the 32 kHz crystal (typically 0.25 s) to settle
CONFIG_SYSTEM_CLOCK_WAIT_FOR_AVAILABILITY=y

CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_USE_GRID=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y
# A quarter-screen draw buffer, 27 KB at 16 bits per pixel.
CONFIG_LV_Z_VDB_SIZE=25

# Display backlight
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_BACKLIGHT_BRT_START=3

# IR receiver (zmk-ir). Decoded frames are logged at debug level; add
# CONFIG_IR_RX_LOG_LEVEL_DBG=y to a logging build to read remote codes.
CONFIG_IR_RX=y

# ZMK saves settings such as the backlight level (set on the More screen) this
# long after the last change. Idle sleep is System OFF, which drops a save
# still waiting, so this has to be well under CONFIG_ZMK_IDLE_SLEEP_TIMEOUT.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=2000

# BTHome broadcasts to Home Assistant (src/bthome.c) use an advertising set of
# their own, next to the one ZMK advertises from.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# dt-lvgl creates every screen at boot: about 240 LVGL objects, an estimated
# 45-50 KB, which is close to dt-lvgl's 57 KB default. Check the real figure
# with CONFIG_DT_LVGL_MEM_MONITOR=y on a logging build after adding screens.
CONFIG_LV_Z_MEM_POOL_SIZE=81920

manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: dmhuisma
      url-base: https://github.com/dmhuisma
    - name: tadakado
      url-base: https://github.com/tadakado
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zephyr-dt-lvgl
      remote: dmhuisma
      revision: main
      path: modules/lib/zephyr-dt-lvgl
    - name: zmk-ir
      remote: tadakado
      path: modules/lib/zmk-ir
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      path: modules/lib/zmk-pointing-acceleration
  self:
    path: config

# Every touchscreen button the remote sends to Home Assistant, and the
# bthome_ble_event each press fires. A press is a BTHome dimmer event with
# the button number as its step count: a tap rotates right, a long press
# rotates left.
#
# Match an event on the remote's address plus event_type and
# event_properties.steps:
#
#   event_type: bthome_ble_event
#   event_data:
#     address: "XX:XX:XX:XX:XX:XX"
#     event_type: rotate_right
#     event_properties:
#       steps: 1
#
# The buttons and numbers come from bthome-buttons and bthome-button-numbers
# in boards/shields/universal_remote/universal_remote_ui.dtsi; keep the two
# in step. tools/gen_hass_automation.py checks them against each other and
# turns this file into an automation to start from.
#
# Navigation buttons (tabs, More rows, Back) send nothing and are not listed.

buttons:

  # Lights
  - id: light_living_room_left
    screen: Lights
    label: "Left"
    target: "light.living_room_left_lamp"
    steps: 1
    events:
      tap: rotate_right
      long_press: rotate_left
  - id: light_living_room_right
    screen: Lights
    label: "Right"
    target: "light.living_room_right_lamp_living_room_right_lamp"
    steps: 2
    events:
      tap: rotate_right
      long_press: rotate_left
